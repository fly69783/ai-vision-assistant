app:
  name: AI视觉辅助盲人环境理解系统
  version: 0.5.0
  environment: development
  api_prefix: /api/v1

server:
  host: 127.0.0.1
  port: 8000
  log_level: INFO
  max_upload_mb: 8
  max_image_pixels: 25000000
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/webp

quality:
  min_width: 320
  min_height: 240
  min_brightness: 25
  max_brightness: 240
  min_blur_score: 20

fusion:
  task_relevance: 0.35
  importance: 0.25
  confidence: 0.20
  novelty: 0.10
  position: 0.10

narration:
  max_items: 3
  low_confidence_threshold: 0.55
  unavailable_message: 当前任务所需的AI能力尚未配置。

providers:
  detector_enabled: false
  ocr_enabled: false
  vision_enabled: false
  timeout_seconds: 25
  vision_model: glm-4.5v
  vision_api_url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  vision_api_key_env: AI_VISION_ZHIPU_API_KEY
  vision_max_tokens: 512
  # ollama = 仅本地；zhipu = 仅云端；hybrid = 本地优先，失败时云端降级。
  vision_backend: zhipu
  local_vision_enabled: false
  local_vision_model: qwen3-vl:4b-instruct-q4_K_M
  local_vision_api_url: http://127.0.0.1:11434/api/chat
  local_vision_timeout_seconds: 120
  local_vision_keep_alive: 5m
  detector_model: ssdlite320_mobilenet_v3_large
  detector_min_confidence: 0.45
  detector_max_results: 10
  ocr_model: PP-OCRv6-small
  ocr_min_confidence: 0.55
  ocr_max_lines: 12
